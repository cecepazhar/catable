[package]
name = "catable-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CATable core library — zero-knowledge encrypted database connection vault, multi-driver runner, SQL guardrails & schema reflection."

[features]
default = []
live-db-tests = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true
tokio.workspace = true
parking_lot.workspace = true
argon2.workspace = true
postgres-native-tls = "0.5"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
mysql_async = { version = "0.37", features = ["native-tls-tls"] }
native-tls = "0.2.18"
duckdb = { version = "1.20000.0", features = ["bundled"] }
redis-async = "0.18.0"
ureq = { workspace = true }
# Pro licensing — Ed25519 offline token verification, stable per-machine hwid
ed25519-dalek = "2"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
once_cell = "1.21"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
ssh2 = "0.9.6"
dirs = "7.0.0"
anyhow = "1.0.104"
[target.'cfg(not(target_os = "android"))'.dependencies]
machine-uid = "0.5"
